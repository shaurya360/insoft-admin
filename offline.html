<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b57b7">
  <title>Offline — INSOFT Admin</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f8fb; color: #1f2937; }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: #6b7280; line-height: 1.5; margin: 0 0 1.5rem; }
    button { font: inherit; font-weight: 600; color: #fff; background: #0b57b7; border: 0; border-radius: 999px; padding: .75rem 1.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>INSOFT Admin needs an internet connection. Your data is safe on the server — reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
