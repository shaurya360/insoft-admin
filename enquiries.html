<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Enquiries — INSOFT Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="icon" href="logo.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b57b7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="INSOFT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="js/pwa.js" defer></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/enquiries.js"></script>
</head>
<body>
  <main id="page">
    <div class="page-head">
      <div>
        <h1>Enquiries</h1>
        <p>Messages sent from the contact form on insofttechnology.in.</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="field grow">
        <label for="q">Search</label>
        <div class="search" id="search-wrap"><input class="input" id="q" type="search" placeholder="Name, company, phone, email or message" autocomplete="off"></div>
      </div>
      <div class="field" style="flex:0 1 180px">
        <label for="status">Status</label>
        <select class="input" id="status">
          <option value="open">New &amp; contacted</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="closed">Closed</option>
          <option value="">All</option>
        </select>
      </div>
    </div>

    <p class="result-count" id="count" aria-live="polite"></p>
    <div id="list"></div>
  </main>
</body>
</html>
